name: build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sverka money.js s dengi.py
        run: python src/verify.py

      - name: Build
        env:
          DIST_DIR: dist
        run: python src/build.py

      - name: Install jsdom
        run: npm install --no-save jsdom

      - name: Prerender and check
        env:
          DIST_DIR: dist
        run: node src/prerender.js

      - name: Publish to repo root
        run: |
          cp dist/index.html dist/manifest.webmanifest dist/sw.js dist/robots.txt .
          cp dist/*.png .
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add -A index.html manifest.webmanifest sw.js robots.txt *.png
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "rebuild site"
            git push
          fi
