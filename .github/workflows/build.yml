name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Применить патч из _apply, если есть
        run: |
          shopt -s nullglob
          parts=(_apply/*.part*)
          if [ ${#parts[@]} -gt 0 ]; then
            echo "частей патча: ${#parts[@]}"
            cat _apply/*.part* | tr -d '\n' | base64 -d | xz -d > /tmp/p.patch
            git apply --binary -p1 /tmp/p.patch
            rm -f _apply/*.part*
          fi
          for f in _apply/*.b64; do
            echo "патч: $f"
            base64 -d "$f" | xz -d > /tmp/p.patch
            git apply --binary -p1 /tmp/p.patch
            rm -f "$f"
          done
      - name: Собрать сайт
        run: |
          cd src
          python build.py
          npm install --no-save jsdom >/dev/null 2>&1
          node prerender.js 1
          node prerender.js 2
      - name: Положить результат в корень
        run: |
          cp src/dist/index.html index.html
          cp src/dist/sw.js sw.js
          cp src/dist/manifest.webmanifest manifest.webmanifest
          rm -rf src/dist src/__pycache__ src/node_modules src/package-lock.json
      - name: Коммит
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "сборка сайта [skip ci]"
          git push
